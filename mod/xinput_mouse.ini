[Mouse]
; Dual Input for Hitman Absolution: pad stays the active device, the mouse
; (e.g. Steam gyro-as-mouse) drives the camera through the game's own mouse path.

; 1 = mouse (gyro) handling on, 0 = off. Handling is also off while no pad is connected.
Enabled=1
; Extra multiplier on mouse X/Y counts given to the game (fractions are carried).
NativeSensitivity=1.0
; 1 = invert vertical mouse look.
InvertY=0
; Real right stick wins: while its radial deflection (0-1) is above this, mouse X/Y is
; removed from the game (and pending smoothing dropped) until the stick is released.
StickOverride=0.25

; ---- smoothing (distance preserving; counts are only delayed, never lost) ----
; Time constant in ms. 0 = off.
NativeSmoothingMs=0
; counts/s. >0: full smoothing below this speed, none above 2x. 0 = smooth at all speeds.
NativeSmoothingMaxSpeed=1500
; 1 = release once per nominal frame (NativeFrameMs), 0 = by measured poll time.
NativeFrameLocked=1
NativeFrameMs=16.667
; Keep the "mouse frame" state for this many extra polls after motion stopped (0 = off).
MouseFrameHold=0

; ---- engine hooks (installed once the game has started; need a game RESTART to change) ----
; The game checks its own code for modification, so nothing in the game's code is changed. The hooks
; only swap object vtable pointers in memory.
; PatchSwitch: 1 = the mouse never becomes the active device (pad glyphs/behaviour stay). 0 = off.
PatchSwitch=1
; PatchCamera: 1 = the mouse (gyro) drives the camera through the game's own mouse path. 0 = off.
PatchCamera=1
; HookMouse: 1 = read mouse movement through DirectInput (needed for everything above). 0 = off.
HookMouse=1
; HookXInput: 1 = watch the pad through the game's XInput calls (needed to detect the pad and stick). 0 = off.
HookXInput=1
; CrashLog: 1 = write exceptions (crashes) to the log. 0 = off.
CrashLog=1
; 0 = mouse never becomes the active device (keyboard still can).
; 1 = pad lock: mouse AND keyboard never become active.
PadLock=0

; 1 (default) = aim assist stays on while the mouse drives the camera (the aim-assist flag
; site is not whitelisted). 0 = aim assist is OFF on mouse (gyro) frames. Hot reload ok.
GyroAimAssist=1

; ---- menus ----
; 0 = mouse X/Y is removed from the game outside gameplay. 1 = passed through.
MenuMouse=0
; 1 = detect gameplay from game flags (below). 0 = always treat as gameplay.
UseMenuFlags=1
; The parts of the gameplay test (each can be switched off if the log shows it is wrong):
;   input enabled  = IM+0xA8 byte of the input manager (and IM must exist)
;   front-end flag = byte 0x1161C7C must be 0
;   pause flag     = byte 0x1161C7D must be 0
UseInputEnabled=1
UseFrontEndFlag=1
UsePauseFlag=1

; ---- hotkey (only while the game window is focused) ----
; Virtual-key code, 0 = off. Example: 121 = F10. Toggles the whole mod.
ToggleKey=121

; ---- diagnostics (xinput_mouse.log next to the DLL) ----
; 0 = problems only; 1 = + install details, transitions (pad, menu flags, active device type);
; 2 = + summary every ~5 s (counters, camera hook hits per call site, IM values, dead zone).
LogLevel=1
